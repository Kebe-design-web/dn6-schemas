<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DN6.0 Schémas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : une appli à écrans successifs (accueil → DN6.0 → produit → liste → schéma), colonne centrée max 560px, fond blanc comme le logo */
:root{
  --bg:#ffffff;
  --surface:#f3f6f3;
  --ink:#16201a;
  --muted:#5b6b60;
  --green:#1f8a2e;
  --green-deep:#13631f;
  --silver:#c9cfcc;
  --line:#e2e8e3;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
.screen{display:flex;flex-direction:column;gap:20px;flex:1}
.top{display:flex;align-items:center;gap:12px;min-height:44px}
.back{font:600 15px var(--body);color:var(--green-deep);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.back:hover{background:var(--surface)}
.crumb{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(28px,7vw,38px)/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h1 span{color:var(--green)}
p.lead{margin:0;color:var(--muted)}
.btn{display:block;width:100%;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  background:linear-gradient(180deg,var(--green),var(--green-deep));border:none;border-radius:14px;padding:16px 20px;cursor:pointer;
  box-shadow:0 2px 0 var(--green-deep),0 8px 18px rgba(19,99,31,.22)}
.btn:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* Accueil */
.home{justify-content:center;align-items:center;text-align:center}
.home img{width:100%;max-width:520px}
.hint{font-size:14px;color:var(--muted)}
/* Bouton DN6.0 */
.big{align-items:center;text-align:center;gap:28px}
.big .top{align-self:stretch}
.big .lead{margin-top:auto}
.big .dn-btn{margin-bottom:auto}
.dn-btn{width:min(260px,80%);aspect-ratio:1;border-radius:50%;border:6px solid var(--silver);
  background:radial-gradient(circle at 35% 30%,#2fae40,var(--green-deep));color:#fff;cursor:pointer;
  font:800 clamp(48px,14vw,64px)/1 var(--display);letter-spacing:.02em;box-shadow:0 10px 30px rgba(19,99,31,.3),inset 0 -6px 0 rgba(0,0,0,.15)}
.dn-btn small{display:block;font:600 14px var(--body);letter-spacing:.1em;text-transform:uppercase;opacity:.85;margin-top:6px}
/* Produit */
.prod-img{width:100%;max-width:440px;margin:0 auto;border:1px solid var(--line);border-radius:12px}
/* Liste */
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;cursor:pointer;font:500 16px/1.3 var(--body);color:var(--ink)}
.item:hover{border-color:var(--green);background:var(--surface)}
.num{flex:none;width:34px;height:34px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font:700 18px var(--display)}
.item .t{flex:1;min-width:0}
.item .arrow{color:var(--green);font-size:20px}
/* Schéma */
.viewer{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;max-height:70vh}
.viewer img{display:block;width:100%;max-width:none}
.viewer.zoom img{width:220%}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tool{flex:1;white-space:nowrap;min-width:0;font:600 15px var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.tool:hover{border-color:var(--green)}
.tool:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id);window.scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('go-dn').onclick=()=>show('s-dn');
$('go-prod').onclick=()=>show('s-prod');
$('go-list').onclick=()=>show('s-list');
const ul=$('list');
S.forEach(([t],i)=>{const li=document.createElement('li');const b=document.createElement('button');b.className='item';b.type='button';
  b.innerHTML=`<span class="num">${i+1}</span><span class="t"></span><span class="arrow">›</span>`;b.querySelector('.t').textContent=t;
  b.onclick=()=>open(i);li.appendChild(b);ul.appendChild(li)});
let cur=0;
function open(i){cur=i;$('v-title').textContent=`${i+1}. ${S[i][0]}`;$('v-img').src=S[i][1];$('v-img').alt=S[i][0];
  $('v-count').textContent=`Schéma ${i+1} / ${S.length}`;$('prev').disabled=i===0;$('next').disabled=i===S.length-1;
  $('viewer').classList.remove('zoom');$('zoom').textContent='Agrandir';$('viewer').scrollTo(0,0);show('s-view')}
$('prev').onclick=()=>cur>0&&open(cur-1);
$('next').onclick=()=>cur<S.length-1&&open(cur+1);
$('zoom').onclick=()=>{const z=$('viewer').classList.toggle('zoom');$('zoom').textContent=z?'Réduire':'Agrandir'};
$('v-img').onclick=()=>$('zoom').click();
</script>
